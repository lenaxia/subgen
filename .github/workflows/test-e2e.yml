name: End-to-End Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator/**'
      - 'worker/**'
      - 'test/**'
      - '.github/workflows/test-e2e.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-grpc-integration:
    name: gRPC Orchestrator-Worker Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build Go orchestrator
        working-directory: ./orchestrator
        run: |
          go mod download
          go build -v -o bin/orchestrator ./cmd/orchestrator

      - name: Install Python worker dependencies
        working-directory: ./worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Python worker
        working-directory: ./worker
        run: |
          # Start worker in background with PYTHONPATH set to include worker directory
          PYTHONPATH=$(pwd) \
          WHISPER_MODEL=tiny \
          TRANSCRIBE_DEVICE=cpu \
          MODEL_PATH=../models \
          python src/main.py &
          WORKER_PID=$!
          echo "WORKER_PID=$WORKER_PID" >> $GITHUB_ENV
          
          # Wait for worker to start
          echo "Waiting for worker to start..."
          sleep 10
          
          # Verify worker is running
          if ! ps -p $WORKER_PID > /dev/null; then
            echo "❌ Worker failed to start"
            exit 1
          fi
          echo "✅ Worker started with PID $WORKER_PID"

      - name: Run gRPC integration tests
        working-directory: ./test/integration
        run: |
          go test -v -timeout 10m -race ./...

      - name: Stop worker
        if: always()
        run: |
          if [ ! -z "$WORKER_PID" ]; then
            kill $WORKER_PID || true
            wait $WORKER_PID 2>/dev/null || true
          fi

  e2e-webhook-to-transcription:
    name: Webhook to Transcription Flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: Build Go orchestrator
        working-directory: ./orchestrator
        run: |
          go mod download
          go build -v -o bin/orchestrator ./cmd/orchestrator

      - name: Install Python worker dependencies
        working-directory: ./worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Whisper tiny model
        run: |
          mkdir -p models
          echo "Whisper model will be auto-downloaded on first use"

      - name: Start Python worker
        working-directory: ./worker
        run: |
          PYTHONPATH=$(pwd) \
          WHISPER_MODEL=tiny \
          TRANSCRIBE_DEVICE=cpu \
          MODEL_PATH=../models \
          GRPC_PORT=50051 \
          python src/main.py &
          echo "WORKER_PID=$!" >> $GITHUB_ENV
          sleep 10

      - name: Start Go orchestrator
        working-directory: ./orchestrator
        run: |
          WEBHOOK_PORT=9000 \
          GRPC_WORKER_ADDR=localhost:50051 \
          PROCESS_ADDED_MEDIA=true \
          PROCESS_MEDIA_ON_PLAY=true \
          PLEX_ENABLED=true \
          PLEX_SERVER=http://localhost:32400 \
          PLEX_TOKEN=test-token-not-used \
          JELLYFIN_ENABLED=false \
          ./bin/orchestrator &
          echo "ORCHESTRATOR_PID=$!" >> $GITHUB_ENV
          sleep 5

      - name: Verify services are running
        run: |
          echo "=== Checking services ==="
          if ! ps -p $WORKER_PID > /dev/null; then
            echo "❌ Worker not running"
            exit 1
          fi
          if ! ps -p $ORCHESTRATOR_PID > /dev/null; then
            echo "❌ Orchestrator not running"
            exit 1
          fi
          echo "✅ Both services running"

      - name: Test webhook endpoint
        run: |
          echo "=== Testing /status endpoint ==="
          curl -f http://localhost:9000/status || exit 1

      - name: Test batch transcription
        run: |
          echo "=== Testing batch transcription ==="
          # Create test directory
          TEST_DIR=$(mktemp -d)
          cp test/testdata/short_audio.mp3 $TEST_DIR/
          
          # Submit batch request
          curl -X POST http://localhost:9000/batch \
            -H "Content-Type: application/json" \
            -d "{\"path\": \"$TEST_DIR\", \"recursive\": false}" \
            -f
          
          echo "✅ Batch request submitted"
          
          # Wait for processing
          sleep 30
          
          # Check if subtitle was created
          if ls $TEST_DIR/*.srt 2>/dev/null; then
            echo "✅ Subtitle file generated"
            ls -lh $TEST_DIR/*.srt
          else
            echo "⚠️  No subtitle file found (may need more time)"
          fi

      - name: Test language detection
        run: |
          echo "=== Testing language detection ==="
          curl -X POST http://localhost:9000/detect-language \
            -F "audio=@test/testdata/short_audio.mp3" \
            -f | jq .

      - name: Stop services
        if: always()
        run: |
          if [ ! -z "$ORCHESTRATOR_PID" ]; then
            kill $ORCHESTRATOR_PID || true
            wait $ORCHESTRATOR_PID 2>/dev/null || true
          fi
          if [ ! -z "$WORKER_PID" ]; then
            kill $WORKER_PID || true
            wait $WORKER_PID 2>/dev/null || true
          fi

  e2e-docker-compose:
    name: Docker Compose Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test docker-compose
        run: |
          cat > docker-compose.test.yml << 'EOF'
          version: '3.8'
          services:
            worker:
              build:
                context: ./worker
                dockerfile: Dockerfile.system-av
              environment:
                - WHISPER_MODEL=tiny
                - TRANSCRIBE_DEVICE=cpu
                - GRPC_PORT=50051
              ports:
                - "50051:50051"
              healthcheck:
                test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), timeout=5)"]
                interval: 10s
                timeout: 5s
                retries: 5
            
            orchestrator:
              build:
                context: ./orchestrator
                dockerfile: Dockerfile
              environment:
                - WEBHOOK_PORT=9000
                - GRPC_WORKER_ADDR=worker:50051
                - PROCESS_ADDED_MEDIA=true
              ports:
                - "9000:9000"
              depends_on:
                worker:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:9000/status"]
                interval: 10s
                timeout: 5s
                retries: 5
          EOF

      - name: Build and start services
        run: |
          docker compose -f docker-compose.test.yml build
          docker compose -f docker-compose.test.yml up -d

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until docker compose -f docker-compose.test.yml ps | grep -q "healthy"; do sleep 2; done'

      - name: Test orchestrator endpoint
        run: |
          curl -f http://localhost:9000/status
          echo "✅ Orchestrator is responding"

      - name: View logs
        if: always()
        run: |
          echo "=== Orchestrator logs ==="
          docker compose -f docker-compose.test.yml logs orchestrator
          echo ""
          echo "=== Worker logs ==="
          docker compose -f docker-compose.test.yml logs worker

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-grpc-integration, e2e-webhook-to-transcription]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "=== End-to-End Test Summary ==="
          echo "gRPC Integration: ${{ needs.e2e-grpc-integration.result }}"
          echo "Webhook Flow: ${{ needs.e2e-webhook-to-transcription.result }}"
          
          if [ "${{ needs.e2e-grpc-integration.result }}" != "success" ] || \
             [ "${{ needs.e2e-webhook-to-transcription.result }}" != "success" ]; then
            echo "❌ Some E2E tests failed"
            exit 1
          fi
          
          echo "✅ All E2E tests passed"
