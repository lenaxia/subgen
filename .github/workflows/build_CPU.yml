name: Build_Subgen_Legacy_CPU

on:
  push:
    paths:
      - 'legacy/**'
  workflow_dispatch:

jobs:
  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test workflows
        run: |
          echo "⚠️  LEGACY WORKFLOW - Building deprecated monolithic Python image"
          echo "✅ Tests will run independently via test-*.yml workflows"
          echo "This workflow builds the legacy CPU Docker image"
          echo ""
          echo "For current architecture, use:"
          echo "  - ghcr.io/lenaxia/subgen-orchestrator:latest"
          echo "  - ghcr.io/lenaxia/subgen-worker:cpu"

  docker:
    runs-on: ubuntu-latest
    needs: test-all
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from legacy/subgen.py
        id: get_version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" legacy/subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          #platforms: all
          image: tonistiigi/binfmt:qemu-v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push legacy CPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./legacy
          platforms: linux/amd64,linux/arm64
          file: ./legacy/Dockerfile.cpu
          push: true
          tags: |
            mccloud/subgen:cpu
            mccloud/subgen:${{ env.version }}-cpu
