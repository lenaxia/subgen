name: Test Go Orchestrator

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator/**'
      - 'api/**'
      - 'test/testdata/**'
      - '.github/workflows/test-orchestrator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'orchestrator/**'
      - 'api/**'
      - 'test/testdata/**'
      - '.github/workflows/test-orchestrator.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: Download dependencies
        working-directory: ./orchestrator
        run: go mod download

      - name: Verify dependencies
        working-directory: ./orchestrator
        run: go mod verify

      - name: Run unit tests
        working-directory: ./orchestrator
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Generate coverage report
        working-directory: ./orchestrator
        run: |
          go tool cover -func=coverage.out
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./orchestrator/coverage.out
          flags: orchestrator-unit
          name: orchestrator-unit-tests
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-unit-coverage
          path: orchestrator/coverage.html

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ffprobe

      - name: Download dependencies
        working-directory: ./orchestrator
        run: go mod download

      - name: Verify test data exists
        run: |
          echo "Checking test data files..."
          ls -lh test/testdata/
          ls -lh orchestrator/test/testdata/ || true

      - name: Run integration tests
        working-directory: ./orchestrator
        run: go test -v -race -timeout 5m ./test/integration/...

      - name: Run webhook integration tests
        working-directory: ./orchestrator
        run: go test -v -race -timeout 5m ./internal/webhooks/...

  real-world-tests:
    name: Real-World Tests with Sample Data
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ffprobe

      - name: Download dependencies
        working-directory: ./orchestrator
        run: go mod download

      - name: Build orchestrator
        working-directory: ./orchestrator
        run: go build -v -o bin/orchestrator ./cmd/orchestrator

      - name: Verify sample data
        run: |
          echo "=== Sample Data Inventory ==="
          find test/testdata -type f -exec ls -lh {} \;
          echo ""
          echo "=== Testing FFprobe on sample files ==="
          for file in test/testdata/*.{mp3,wav,mp4,mkv}; do
            if [ -f "$file" ]; then
              echo "Testing: $file"
              ffprobe -v error -show_format -show_streams "$file" 2>&1 | head -20
              echo "---"
            fi
          done

      - name: Test skip logic with real files
        working-directory: ./orchestrator
        run: |
          echo "=== Testing skip logic against real media files ==="
          go test -v -race -run TestSkip ./internal/skip/... -args -testdata=../test/testdata

      - name: Test language detection with real audio
        working-directory: ./orchestrator
        run: |
          echo "=== Testing language detection ==="
          # Run tests that use real audio files
          go test -v -race -run TestDetectLanguage ./internal/webhooks/...

      - name: Test batch processing
        working-directory: ./orchestrator
        run: |
          echo "=== Testing batch processing ==="
          go test -v -race -run TestBatch ./internal/webhooks/...

  benchmark-tests:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: Download dependencies
        working-directory: ./orchestrator
        run: go mod download

      - name: Run benchmarks
        working-directory: ./orchestrator
        run: |
          go test -bench=. -benchmem -benchtime=5s ./internal/... > benchmark.txt
          cat benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-benchmarks
          path: orchestrator/benchmark.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: orchestrator/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: orchestrator
          args: --timeout=5m

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, real-world-tests, lint]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "=== Orchestrator Test Summary ==="
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Real-World Tests: ${{ needs.real-world-tests.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.real-world-tests.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          
          echo "✅ All orchestrator tests passed"
