name: Test Python Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'test/testdata/**'
      - '.github/workflows/test-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'test/testdata/**'
      - '.github/workflows/test-worker.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: ./worker
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --timeout=300
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run unit tests
        working-directory: ./worker
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing -m "not slow"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./worker/coverage.xml
          flags: worker-unit-py${{ matrix.python-version }}
          name: worker-unit-tests-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: worker-unit-coverage-py${{ matrix.python-version }}
          path: worker/htmlcov/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: ./worker
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --timeout=300
          pip install pytest pytest-asyncio pytest-mock

      - name: Verify test data exists
        run: |
          echo "=== Checking test data files ==="
          ls -lh test/testdata/

      - name: Run integration tests
        working-directory: ./worker
        run: |
          pytest tests/integration/ -v --timeout=300

  memory-leak-tests:
    name: Memory Leak Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: ./worker
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --timeout=300
          pip install pytest pytest-mock psutil

      - name: Run memory leak tests
        working-directory: ./worker
        run: |
          pytest tests/unit/test_memory_leaks.py -v --timeout=600

  real-world-transcription-tests:
    name: Real-World Transcription Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: ./worker
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --timeout=300
          pip install pytest

      - name: Download Whisper tiny model
        run: |
          mkdir -p models
          echo "Whisper model will be auto-downloaded on first use"

      - name: Test language detection with sample data
        working-directory: ./worker
        run: |
          echo "=== Testing language detection on real audio ==="
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from language.detector import LanguageDetector
          from config.settings import Settings
          
          settings = Settings(
              whisper_model='tiny',
              transcribe_device='cpu',
              model_path='../models'
          )
          detector = LanguageDetector(settings)
          
          # Test with sample audio
          result = detector.detect('../test/testdata/short_audio.mp3', sample_length=10)
          print(f'Detected language: {result.language_code}')
          print(f'Confidence: {result.confidence}')
          print(f'Language name: {result.language_name}')
          
          assert result.language_code is not None
          assert result.confidence > 0
          print('✅ Language detection test passed')
          "

      - name: Test audio extraction
        working-directory: ./worker
        run: |
          echo "=== Testing audio extraction ==="
          python -c "
          import sys
          import os
          sys.path.insert(0, 'src')
          from audio.extractor import AudioExtractor
          
          extractor = AudioExtractor()
          
          # Test with video file
          audio_path = extractor.extract_audio('../test/testdata/demo_video_speech.mp4', track_index=0)
          print(f'Extracted audio to: {audio_path}')
          assert os.path.exists(audio_path)
          
          # Cleanup
          if audio_path != '../test/testdata/demo_video_speech.mp4':
              os.remove(audio_path)
          
          print('✅ Audio extraction test passed')
          "

      - name: Test subtitle generation with tiny model
        working-directory: ./worker
        run: |
          echo "=== Testing subtitle generation ==="
          python -c "
          import sys
          import os
          sys.path.insert(0, 'src')
          from transcription.engine import TranscriptionEngine
          from config.settings import Settings
          
          settings = Settings(
              whisper_model='tiny',
              transcribe_device='cpu',
              model_path='../models',
              whisper_threads=2
          )
          engine = TranscriptionEngine(settings)
          
          # Test with short audio
          result = engine.transcribe(
              file_path='../test/testdata/short_audio.mp3',
              task_type='transcribe',
              force_language=None
          )
          
          print(f'Transcription completed: {result.success}')
          print(f'Detected language: {result.detected_language}')
          print(f'Text: {result.text[:100] if result.text else \"None\"}...')
          
          assert result.success == True
          assert result.detected_language is not None
          print('✅ Transcription test passed')
          "
          timeout-minutes: 5

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort

      - name: Run ruff
        working-directory: ./worker
        run: ruff check src/ tests/

      - name: Run black
        working-directory: ./worker
        run: black --check src/ tests/

      - name: Run isort
        working-directory: ./worker
        run: isort --check-only src/ tests/

      - name: Run mypy
        working-directory: ./worker
        run: mypy src/ --ignore-missing-imports

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, memory-leak-tests, real-world-transcription-tests, lint]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "=== Python Worker Test Summary ==="
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Memory Leak Tests: ${{ needs.memory-leak-tests.result }}"
          echo "Real-World Tests: ${{ needs.real-world-transcription-tests.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.memory-leak-tests.result }}" != "success" ] || \
             [ "${{ needs.real-world-transcription-tests.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          
          echo "✅ All worker tests passed"
