name: Build_Subgen_Dockerfile_GPU

on:
  push:
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
      - 'worker/**'
      - 'orchestrator/**'
  workflow_dispatch:

jobs:
  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test workflows
        run: |
          echo "✅ Tests will run independently via test-*.yml workflows"
          echo "This workflow will build Docker images"
          echo "For full test coverage, see:"
          echo "  - test-orchestrator.yml"
          echo "  - test-worker.yml"
          echo "  - test-e2e.yml"

  docker:
    runs-on: [self-hosted]
    needs: test-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Get version from subgen.py
        id: get_version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mccloud/subgen:latest
            mccloud/subgen:${{ env.version }}
