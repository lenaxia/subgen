name: Build_Subgen_Legacy_GPU

on:
  push:
    paths:
      - 'legacy/**'
  workflow_dispatch:

jobs:
  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test workflows
        run: |
          echo "⚠️  LEGACY WORKFLOW - Building deprecated monolithic Python image"
          echo "✅ Tests will run independently via test-*.yml workflows"
          echo "This workflow builds the legacy GPU Docker image"
          echo ""
          echo "For current architecture, use:"
          echo "  - lenaxia/subgen-orchestrator:latest"
          echo "  - lenaxia/subgen-worker:latest"

  docker:
    runs-on: [self-hosted]
    needs: test-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Get version from legacy/subgen.py
        id: get_version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" legacy/subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push legacy GPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./legacy
          file: ./legacy/Dockerfile
          push: true
          tags: |
            mccloud/subgen:latest
            mccloud/subgen:${{ env.version }}
