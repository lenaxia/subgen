# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

# ============================================================================
# Subgen Worker - Kubernetes Deployment (Phase 2: Separate Deployments)
# ============================================================================
# Chart: bjw-s/app-template v4.6.2+
# Deployment: Workers only (discovered by orchestrator via K8s API)
# ============================================================================

# ============================================================================
# Global Pod Configuration
# ============================================================================
defaultPodOptions:
  automountServiceAccountToken: false  # Workers don't need K8s API access
  
  securityContext:
    fsGroup: 568  # Media server user
    fsGroupChangePolicy: "OnRootMismatch"
  
  annotations:
    reloader.stakater.com/auto: "true"  # Auto-reload on ConfigMap/Secret change

# ============================================================================
# Controllers
# ============================================================================
controllers:
  main:
    type: statefulset  # StatefulSet for stable pod names
    replicas: 3  # IMPORTANT: Scale workers here!
    strategy: RollingUpdate
    
    containers:
      # ──────────────────────────────────────────────────────────────────
      # Python Worker Container
      # ──────────────────────────────────────────────────────────────────
      worker:
        image:
          repository: ghcr.io/your-username/subgen-worker
          tag: "latest"  # IMPORTANT: Change to specific version in production
          pullPolicy: Always
        
        env:
          # Worker config
          GRPC_PORT: "50051"
          LOG_LEVEL: "info"
          LOG_FORMAT: "json"
          
          # Whisper config
          WHISPER_MODEL: "medium"  # Options: tiny, base, small, medium, large, large-v3
          WHISPER_THREADS: "4"
          TRANSCRIBE_DEVICE: "cpu"  # Options: cpu, cuda
          COMPUTE_TYPE: "auto"  # Options: int8, int8_float16, float16, float32, auto
          MODEL_PATH: "/models"
          
          # Memory management
          MEMORY_THRESHOLD_MB: "3000"
          MODEL_CLEANUP_DELAY: "30"
          CLEAR_VRAM_ON_COMPLETE: "true"
          
          # Subtitle config
          WORD_LEVEL_HIGHLIGHT: "false"
          CUSTOM_REGROUP: "cm_sl=84_sl=42++++++1"
          LRC_FOR_AUDIO_FILES: "true"
          APPEND: "false"
          SUBTITLE_LANGUAGE_NAME: "aa"
          
          # Cache directories
          XDG_CACHE_HOME: "/cache"
          HF_HOME: "/cache/huggingface"
          MPLCONFIGDIR: "/cache/matplotlib"
        
        ports:
          - name: grpc
            containerPort: 50051
            protocol: TCP
          - name: http
            containerPort: 8080
            protocol: TCP
        
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 8080
            spec:
              initialDelaySeconds: 60
              periodSeconds: 60
              timeoutSeconds: 10
              failureThreshold: 3
          
          readiness:
            enabled: true
            type: HTTP
            path: /ready
            port: 8080
            spec:
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
          
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 8080
            spec:
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30  # 5 min for model download
        
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 4Gi  # Hard OOM kill if exceeded
            cpu: 2000m

# ============================================================================
# Services
# ============================================================================
service:
  main:
    controller: main
    type: ClusterIP  # Internal only - orchestrator discovers via Endpoints
    ports:
      grpc:
        port: 50051
        targetPort: grpc
        protocol: TCP
      http:
        port: 8080
        targetPort: http
        protocol: TCP

# ============================================================================
# Persistence
# ============================================================================
persistence:
  # Media files on NFS (read-write)
  media:
    enabled: true
    type: nfs
    server: 192.168.1.10  # IMPORTANT: Change to your NAS IP
    path: /mnt/pool/media  # IMPORTANT: Change to your NFS export path
    globalMounts:
      - path: /media
        readOnly: false
  
  # Whisper models (PVC per worker)
  # Each worker gets its own PVC for model storage
  models:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: local-path  # IMPORTANT: Change to your storage class
    retain: true
    globalMounts:
      - path: /models
  
  # Cache (tmpfs for fast model loading)
  cache:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    globalMounts:
      - path: /cache
