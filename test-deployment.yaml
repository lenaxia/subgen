# Subgen Test Deployment for Default Namespace
# Testing worker discovery and scaling (Epic 9, Story 7)

---
# ConfigMap for orchestrator configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: subgen-orchestrator-config
  namespace: default
data:
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
  WEBHOOK_PORT: "9000"
  METRICS_PORT: "9090"
  # Worker discovery configuration
  WORKER_DISCOVERY: "kubernetes"
  WORKER_SERVICE_NAME: "subgen-worker"
  WORKER_NAMESPACE: "default"
  WORKER_PORT: "50051"
  # Queue configuration
  QUEUE_MAX_SIZE: "100"
  QUEUE_WORKER_TIMEOUT: "300"
  # Skip conditions for testing
  SKIP_IF_INTERNAL_SUBTITLES_LANGUAGE: "eng"
  SKIP_IF_TARGET_SUBTITLES_EXIST: "false"
  # Processing flags
  PROCESS_ADDED_MEDIA: "false"
  PROCESS_MEDIA_ON_PLAY: "false"
  TRANSCRIBE_OR_TRANSLATE: "transcribe"
  # Media server config
  PLEX_ENABLED: "true"
  PLEX_SERVER: "http://dummy:32400"
  JELLYFIN_ENABLED: "false"

---
# ServiceAccount for orchestrator (needed for Kubernetes API access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: subgen-orchestrator
  namespace: default

---
# Role for worker discovery (read-only access to endpoints)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: subgen-orchestrator
  namespace: default
rules:
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding linking ServiceAccount to Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: subgen-orchestrator
  namespace: default
subjects:
- kind: ServiceAccount
  name: subgen-orchestrator
  namespace: default
roleRef:
  kind: Role
  name: subgen-orchestrator
  apiGroup: rbac.authorization.k8s.io

---
# Deployment for orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subgen-orchestrator
  namespace: default
  labels:
    app: subgen
    component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subgen
      component: orchestrator
  template:
    metadata:
      labels:
        app: subgen
        component: orchestrator
    spec:
      serviceAccountName: subgen-orchestrator
      automountServiceAccountToken: true
      containers:
      - name: orchestrator
        image: ghcr.io/lenaxia/subgen-orchestrator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: subgen-orchestrator-config
        - secretRef:
            name: subgen-secrets
        env:
        - name: DEBUG
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3

---
# Service for orchestrator
apiVersion: v1
kind: Service
metadata:
  name: subgen-orchestrator
  namespace: default
spec:
  selector:
    app: subgen
    component: orchestrator
  ports:
  - name: http
    port: 9000
    targetPort: 9000
  - name: metrics
    port: 9090
    targetPort: 9090

---
# ConfigMap for worker configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: subgen-worker-config
  namespace: default
data:
  GRPC_PORT: "50051"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
  WHISPER_MODEL: "tiny"  # Using tiny model for faster testing
  WHISPER_THREADS: "2"
  TRANSCRIBE_DEVICE: "cpu"
  COMPUTE_TYPE: "auto"
  MODEL_CLEANUP_DELAY: "30"
  CONCURRENT_TRANSCRIPTIONS: "1"

---
# Deployment for workers (StatefulSet for stable pod names)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: subgen-worker
  namespace: default
  labels:
    app: subgen
    component: worker
spec:
  serviceName: subgen-worker
  replicas: 2  # Start with 2 workers for testing scaling
  selector:
    matchLabels:
      app: subgen
      component: worker
  template:
    metadata:
      labels:
        app: subgen
        component: worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/lenaxia/subgen-worker:cpu
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        envFrom:
        - configMapRef:
            name: subgen-worker-config
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: models
        emptyDir: {}
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

---
# Service for workers (headless service for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: subgen-worker
  namespace: default
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: subgen
    component: worker
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051