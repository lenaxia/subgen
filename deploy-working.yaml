# Subgen Working Deployment
# IMPORTANT: Always use versioned tags (e.g., v0.2.4, v0.2.5) NOT mutable tags (e.g., latest, cpu)
# This ensures protobuf compatibility between orchestrator and worker

apiVersion: v1
kind: ConfigMap
metadata:
  name: subgen-orchestrator-config
  namespace: default
data:
  # Orchestrator configuration
  WEBHOOK_PORT: "9000"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
  
  # Worker discovery (Kubernetes mode)
  WORKER_DISCOVERY: "kubernetes"
  WORKER_SERVICE_NAME: "subgen-worker"
  WORKER_NAMESPACE: "default"
  WORKER_PORT: "50051"
  
  # Queue configuration
  QUEUE_MAX_SIZE: "1000"
  QUEUE_WORKER_TIMEOUT: "18000"  # 5 hours
  
  # Processing flags
  PROCESS_ADDED_MEDIA: "true"
  PROCESS_MEDIA_ON_PLAY: "false"
  TRANSCRIBE_OR_TRANSLATE: "transcribe"
  
  # Skip conditions
  SKIP_IF_INTERNAL_SUBTITLES_LANGUAGE: "eng"
  SKIP_IF_TARGET_SUBTITLES_EXIST: "true"
  
  # Media server configuration
  PLEX_ENABLED: "true"
  PLEX_SERVER: "http://plex.media.svc.cluster.local:32400"
  PLEX_QUEUE_NEXT_EPISODE: "false"
  JELLYFIN_ENABLED: "false"
  JELLYFIN_SERVER: "http://jellyfin.media.svc.cluster.local:8096"
  
  # Path mapping for media files
  USE_PATH_MAPPING: "true"
  PATH_MAPPING_FROM: "/media"
  PATH_MAPPING_TO: "/mnt/downloads/[Plex Temp Library]"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: subgen-worker-config
  namespace: default
data:
  # Worker configuration
  GRPC_PORT: "50051"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Whisper model configuration
  WHISPER_MODEL: "medium"  # Options: tiny, base, small, medium, large, large-v3
  WHISPER_THREADS: "4"
  TRANSCRIBE_DEVICE: "cpu"  # Options: cpu, cuda
  COMPUTE_TYPE: "auto"  # Options: int8, int8_float16, float16, float32, auto
  MODEL_PATH: "/models"
  
  # Memory management
  MEMORY_THRESHOLD_MB: "3000"
  MODEL_CLEANUP_DELAY: "300"  # 5 minutes for CPU workers
  CLEAR_VRAM_ON_COMPLETE: "false"  # Keep model loaded for CPU workers
  
  # Subtitle configuration
  WORD_LEVEL_HIGHLIGHT: "false"
  CUSTOM_REGROUP: "cm_sl=84_sl=42++++++1"
  LRC_FOR_AUDIO_FILES: "true"
  APPEND: "false"
  SUBTITLE_LANGUAGE_NAME: "aa"
  
  # Cache directories
  XDG_CACHE_HOME: "/cache"
  HF_HOME: "/cache/huggingface"
  MPLCONFIGDIR: "/cache/matplotlib"
---
apiVersion: v1
kind: Secret
metadata:
  name: subgen-secrets
  namespace: default
type: Opaque
stringData:
  # Media server tokens (update with your actual tokens)
  PLEX_TOKEN: "dummy-token-placeholder"
  JELLYFIN_TOKEN: "dummy-token-placeholder"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: subgen-orchestrator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: subgen-orchestrator-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: subgen-orchestrator-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: subgen-orchestrator-role
subjects:
- kind: ServiceAccount
  name: subgen-orchestrator
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subgen-orchestrator
  namespace: default
  labels:
    app: subgen
    component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subgen
      component: orchestrator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: subgen
        component: orchestrator
    spec:
      serviceAccountName: subgen-orchestrator
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
      - name: orchestrator
        image: ghcr.io/lenaxia/subgen-orchestrator:v0.2.7
        imagePullPolicy: Always
        env:
        - name: DEBUG
          value: "true"
        envFrom:
        - configMapRef:
            name: subgen-orchestrator-config
        - secretRef:
            name: subgen-secrets
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9090
          name: metrics
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - mountPath: /tmp/subgen
          name: temp
        - mountPath: /media
          name: media
      volumes:
      - name: temp
        emptyDir: {}
      - name: media
        emptyDir: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: subgen-worker
  namespace: default
  labels:
    app: subgen
    component: worker
spec:
  serviceName: subgen-worker
  replicas: 2
  selector:
    matchLabels:
      app: subgen
      component: worker
  template:
    metadata:
      labels:
        app: subgen
        component: worker
    spec:
      securityContext:
        fsGroup: 0
        runAsUser: 0
        runAsGroup: 0
      containers:
      - name: worker
        image: ghcr.io/lenaxia/subgen-worker:v0.2.7-cpu
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: subgen-worker-config
        ports:
        - containerPort: 50051
          name: grpc
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - mountPath: /models
          name: models
        - mountPath: /mnt/downloads
          name: media
      volumes:
      - name: models
        emptyDir: {}
      - name: media
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: subgen-worker
  namespace: default
  labels:
    app: subgen
    component: worker
spec:
  selector:
    app: subgen
    component: worker
  ports:
  - port: 50051
    targetPort: grpc
    name: grpc
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: subgen-orchestrator
  namespace: default
  labels:
    app: subgen
    component: orchestrator
spec:
  selector:
    app: subgen
    component: orchestrator
  ports:
  - port: 9000
    targetPort: http
    name: http
  - port: 9090
    targetPort: metrics
    name: metrics